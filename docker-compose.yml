services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docsmind-postgres
    environment:
      POSTGRES_USER: docsmind
      POSTGRES_PASSWORD: docsmind
      POSTGRES_DB: docsmind
    ports:
      - "5433:5432"
    volumes:
      - docsmind-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docsmind-pgdata:
