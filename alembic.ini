[alembic]
script_location = alembic
prepend_sys_path = .

# No sqlalchemy.url here on purpose — env.py reads it from DocsmindConfig
# (i.e. DOCSMIND_DATABASE_URL / .env), so the same connection info the app
# uses is what migrations run against. See alembic/env.py.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
