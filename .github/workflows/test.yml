name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is our declared floor (see pyproject.toml `requires-python`);
        # 3.12 is the default dev version (see .python-version). Test both
        # ends plus the one in between so a dependency silently requiring a
        # newer interpreter shows up here instead of in someone's install.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src/docsmind
        continue-on-error: true # tighten once the core modules are fleshed out

      - name: Test
        # testcontainers[postgres] pulls pgvector/pgvector and manages its own
        # container via the Docker socket, which GitHub's ubuntu runners expose
        # by default — no separate `services:` postgres block needed.
        run: uv run pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Build wheel and sdist
        run: uv build
      - name: Check wheel installs cleanly (core deps only, no extras)
        run: |
          uv venv /tmp/check-venv
          uv pip install --python /tmp/check-venv/bin/python dist/*.whl
          /tmp/check-venv/bin/python -c "import docsmind; print(docsmind.__version__)"
