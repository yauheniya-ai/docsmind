[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsmind"
version = "0.3.0"
description = "Chat with your documents. Version-aware retrieval, change analysis, and an editable table workspace, backed by Postgres/pgvector."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yauheniya Varabyova", email = "yauheniya.ai@gmail.com" }
]
keywords = ["rag", "agent", "pgvector", "documents", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.2.5",
    "alembic>=1.13",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "imagehash>=4.3",
    "rich>=13.7",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.34"]
server = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
mlflow = ["mlflow>=2.14"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "testcontainers[postgres]>=4.4", "ruff>=0.5", "mypy>=1.10"]
all = ["docsmind[openai,anthropic,server]"]

[dependency-groups]
dev = ["build>=1.6.1", "twine>=7.0.0"]

[project.scripts]
docsmind = "docsmind.cli.app:main"

[project.urls]
Homepage = "https://github.com/yauheniya-ai/docsmind"
Repository = "https://github.com/yauheniya-ai/docsmind"
Issues = "https://github.com/yauheniya-ai/docsmind/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/docsmind"]
include = ["src/docsmind/server/ui/**"]

[tool.hatch.build.targets.sdist]
include = [
  "src/docsmind/**",
  "README.md",
  "CHANGELOG.md",
  "scripts/bundle_frontend.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Typer's documented pattern is `typer.Argument(...)`/`typer.Option(...)` as
# the parameter default itself (it inspects the call, not a runtime value) —
# ruff's B008 doesn't know that's the intended usage for this framework.
"src/docsmind/cli/*.py" = ["B008"]
# PyMuPDF/Pillow don't document a stable exception type for "this embedded
# image is corrupt" — and a single malformed image in an otherwise-fine PDF
# shouldn't abort the whole ingest, so we deliberately catch broadly here and
# skip the one image rather than propagate.
"src/docsmind/ingestion/parsers/pdf.py" = ["BLE001"]
